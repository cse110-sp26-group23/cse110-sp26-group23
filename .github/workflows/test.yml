name: PR Quality Check

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx --yes eslint@9 --no-error-on-unmatched-pattern "source/**/*.js" "e2e/**/*.js" "playwright.config.js"

  unit-test:
    name: Unit Tests (Jasmine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jasmine specs
        run: |
          shopt -s nullglob globstar
          files=(source/tests/**/*.test.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::notice::No unit tests found yet, skipping."
            exit 0
          fi
          npx jasmine "${files[@]}"

  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  validate:
    name: HTML/CSS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML
        run: |
          shopt -s nullglob globstar
          files=(source/**/*.html)
          nonempty=()
          for f in "${files[@]}"; do
            [ -s "$f" ] && nonempty+=("$f")
          done
          if [ ${#nonempty[@]} -eq 0 ]; then
            echo "::notice::No HTML files to validate yet, skipping."
            exit 0
          fi
          npx --yes html-validate@9 "${nonempty[@]}"

      - name: Validate CSS
        run: |
          shopt -s nullglob globstar
          files=(source/**/*.css)
          nonempty=()
          for f in "${files[@]}"; do
            [ -s "$f" ] && nonempty+=("$f")
          done
          if [ ${#nonempty[@]} -eq 0 ]; then
            echo "::notice::No CSS files to validate yet, skipping."
            exit 0
          fi
          # stylelint resolves `extends` from the config file's location, which
          # has no node_modules. Point it at the npx cache where the config lives.
          npx --yes -p stylelint@16 -p stylelint-config-standard@36 -- bash -c '
            basedir=$(dirname "$(dirname "$(command -v stylelint)")")
            stylelint --config-basedir "$basedir" "$@"
          ' -- "${nonempty[@]}"
